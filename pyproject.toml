[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loco-adk-demo"
version = "0.1.0"
description = "Customer support demo: Google ADK agents scheduled by LOCO-Agent"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0.0",
    "loco-agent @ git+https://github.com/ArielSmoliar/loco-agent.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
